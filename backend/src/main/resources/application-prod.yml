spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:family_home}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    # 生产必须显式注入 JWT_SECRET（base64，≥32 字节）；未设置则启动失败
    secret: ${JWT_SECRET}
  cors:
    # 生产跨域白名单必须显式注入；为空则不允许任何跨域来源
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    # 生产默认关闭 Swagger / H2 控制台
    dev-tools-enabled: ${DEV_TOOLS_ENABLED:false}
  sms:
    debug: false
    # 生产接入真实短信服务：阿里云/腾讯云配置
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:}
    template-code: ${SMS_TEMPLATE_CODE:}
