server:
  port: 8080

spring:
  application:
    name: family-home
  datasource:
    # 开发/测试默认使用 H2（MySQL 兼容模式），生产切换到 MySQL 见 application-prod.yml
    url: jdbc:h2:mem:familyhome;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 开发默认密钥（base64，≥32 字节）；生产必须通过 JWT_SECRET 环境变量注入，见 application-prod.yml
    secret: ${JWT_SECRET:ZmFtaWx5aG9tZS1kZWZhdWx0LXNlY3JldC1rZXktZm9yLWRldi1vbmx5LWNoYW5nZS1pbi1wcm9kLTIwMjY=}
    expire-hours: 72
  cors:
    # 跨域域名白名单（逗号分隔）；开发默认本机前端，生产用 CORS_ALLOWED_ORIGINS 注入
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # 是否开放 Swagger / H2 控制台等开发调试工具；生产关闭
    dev-tools-enabled: ${DEV_TOOLS_ENABLED:true}
  sms:
    # 开发环境：验证码直接打印日志/固定 123456，便于联调；生产接真实短信服务
    debug: true
