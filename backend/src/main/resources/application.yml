server:
  port: 8080

spring:
  application:
    name: family-home
  datasource:
    # 开发/测试使用 MySQL，废弃 H2；连接信息可用环境变量覆盖
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:family_home}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      # 启动时自动执行建表脚本（CREATE TABLE IF NOT EXISTS，幂等，不清理已有数据）
      mode: always
      schema-locations: classpath:db/init.sql
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 开发默认密钥（base64，≥32 字节）；生产必须通过 JWT_SECRET 环境变量注入，见 application-prod.yml
    secret: ${JWT_SECRET:ZmFtaWx5aG9tZS1kZWZhdWx0LXNlY3JldC1rZXktZm9yLWRldi1vbmx5LWNoYW5nZS1pbi1wcm9kLTIwMjY=}
    expire-hours: 72
  cors:
    # 跨域域名白名单（逗号分隔）；开发默认本机前端，生产用 CORS_ALLOWED_ORIGINS 注入
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # 是否开放 Swagger / H2 控制台等开发调试工具；生产关闭
    dev-tools-enabled: ${DEV_TOOLS_ENABLED:true}
  sms:
    # 开发环境：验证码直接打印日志/固定 123456，便于联调；生产接真实短信服务
    debug: true
